name: Lint and test

# Только push в long-lived ветки: коммит — главный триггер. pull_request убран,
# иначе push в dev + открытый PR dev->main гоняли весь пайплайн дважды.
# Публикация образов больше здесь не происходит — её режет тег (см. release-please.yml).
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  test:
    name: Run tests in Docker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set runner user for containers
        run: |
          echo "RUNNER_UID=$(id -u)" >> $GITHUB_ENV
          echo "RUNNER_GID=$(id -g)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Create network for Docker Compose
        run: docker network create pulpie-services-network 2>/dev/null || true

      - name: Build API image (CPU)
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ./Dockerfile
          tags: pulpie-orange:latest
          load: true
          push: false
          # Читаем слой-кэш, который пишет publish-cpu (scope=pulpie-orange-cpu, тот же Dockerfile).
          # Только read — без cache-to, чтобы транзиентный "failed to reserve cache" не ронял гейт.
          cache-from: type=gha,scope=pulpie-orange-cpu

      - name: Build dev image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ./Dockerfile.dev
          tags: pulpie-orange-dev:latest
          load: true
          push: false
          # Базовые слои (FROM pulpie-orange) берутся из того же кэша CPU-образа.
          cache-from: type=gha,scope=pulpie-orange-cpu

      - name: Lint with ruff
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm pulpie-orange-dev ruff check . --output-format=github

      - name: Run tests in container
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm pulpie-orange-dev pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

  notify-telegram:
    name: Notify Telegram
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checks failed
        if: needs.test.result != 'success'
        uses: appleboy/telegram-action@v1.0.1
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            *Проверки упали*
            Репозиторий: `${{ github.repository }}`
            Ветка: `${{ github.ref_name }}`
            Коммит: `${{ github.sha }}`
            [Открыть run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Checks passed
        if: needs.test.result == 'success'
        uses: appleboy/telegram-action@v1.0.1
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          disable_notification: true
          message: |
            *Проверки прошли*
            Репозиторий: `${{ github.repository }}`
            Ветка: `${{ github.ref_name }}`
            Коммит: `${{ github.sha }}`
            [Открыть run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

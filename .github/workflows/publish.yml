name: Publish Docker image

# workflow_run всегда исполняет файл с ветки по умолчанию (main),
# поэтому правки на dev никогда не попадали в ран. Этот workflow вызывается
# из Lint and test того же коммита, который только что прошёл проверки.
on:
  workflow_call:
    inputs:
      head_sha:
        description: SHA коммита, который прошёл Lint and test
        required: true
        type: string
      head_branch:
        description: Ветка этого коммита
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  publish-prod:
    if: (inputs.head_branch || github.ref_name) == 'main'
    name: Build and push prod to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pulpie-orange" >> $GITHUB_ENV

      - name: Build and push runtime (prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_BASE }}:main
            ${{ env.IMAGE_BASE }}:${{ inputs.head_sha || github.sha }}
          push: true
          provenance: false
          cache-from: type=gha,scope=pulpie-orange-main
          cache-to: type=gha,mode=max,scope=pulpie-orange-main

  publish-dev:
    if: (inputs.head_branch || github.ref_name) == 'dev'
    name: Build and push dev runtime to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pulpie-orange" >> $GITHUB_ENV

      - name: Build and push runtime (dev tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_BASE }}:dev
            ${{ env.IMAGE_BASE }}:${{ inputs.head_sha || github.sha }}
          push: true
          provenance: false
          cache-from: type=gha,scope=pulpie-orange-dev
          cache-to: type=gha,mode=max,scope=pulpie-orange-dev

  publish-cuda-prod:
    if: (inputs.head_branch || github.ref_name) == 'main'
    name: Build and push cuda (prod) to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pulpie-orange" >> $GITHUB_ENV

      - name: Build and push cuda (prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cuda
          # Официальный pytorch/*cuda* публикуется только под linux/amd64.
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_BASE }}:main-cuda
            ${{ env.IMAGE_BASE }}:${{ inputs.head_sha || github.sha }}-cuda
          push: true
          provenance: false
          cache-from: type=gha,scope=pulpie-orange-main-cuda
          cache-to: type=gha,mode=max,scope=pulpie-orange-main-cuda

  publish-cuda-dev:
    if: (inputs.head_branch || github.ref_name) == 'dev'
    name: Build and push cuda (dev) to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pulpie-orange" >> $GITHUB_ENV

      - name: Build and push cuda (dev)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cuda
          # Официальный pytorch/*cuda* публикуется только под linux/amd64.
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_BASE }}:dev-cuda
            ${{ env.IMAGE_BASE }}:${{ inputs.head_sha || github.sha }}-cuda
          push: true
          provenance: false
          cache-from: type=gha,scope=pulpie-orange-dev-cuda
          cache-to: type=gha,mode=max,scope=pulpie-orange-dev-cuda

  notify-telegram:
    name: Notify Telegram
    needs: [publish-prod, publish-dev, publish-cuda-prod, publish-cuda-dev]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pulpie-orange" >> "$GITHUB_OUTPUT"

      - name: Prod image published
        if: needs.publish-prod.result == 'success'
        uses: appleboy/telegram-action@v1.0.1
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          disable_notification: true
          message: |
            *Образ опубликован в GHCR*
            Репозиторий: `${{ github.repository }}`
            Ветка: `${{ inputs.head_branch || github.ref_name }}`
            Теги: `:main` и `:${{ inputs.head_sha || github.sha }}`
            Образ: `${{ steps.image.outputs.name }}:main`
            [Открыть run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Dev image published
        if: needs.publish-dev.result == 'success'
        uses: appleboy/telegram-action@v1.0.1
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          disable_notification: true
          message: |
            *Образ опубликован в GHCR*
            Репозиторий: `${{ github.repository }}`
            Ветка: `${{ inputs.head_branch || github.ref_name }}`
            Теги: `:dev` и `:${{ inputs.head_sha || github.sha }}`
            Образ: `${{ steps.image.outputs.name }}:dev`
            [Открыть run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Prod publish failed
        if: needs.publish-prod.result == 'failure'
        uses: appleboy/telegram-action@v1.0.1
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            *Публикация образа не удалась*
            Репозиторий: `${{ github.repository }}`
            Ветка: `${{ inputs.head_branch || github.ref_name }}`
            Теги: `:main` и `:${{ inputs.head_sha || github.sha }}`
            Образ: `${{ steps.image.outputs.name }}:main`
            [Открыть run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Dev publish failed
        if: needs.publish-dev.result == 'failure'
        uses: appleboy/telegram-action@v1.0.1
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            *Публикация образа не удалась*
            Репозиторий: `${{ github.repository }}`
            Ветка: `${{ inputs.head_branch || github.ref_name }}`
            Теги: `:dev` и `:${{ inputs.head_sha || github.sha }}`
            Образ: `${{ steps.image.outputs.name }}:dev`
            [Открыть run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Prod cuda image published
        if: needs.publish-cuda-prod.result == 'success'
        uses: appleboy/telegram-action@v1.0.1
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          disable_notification: true
          message: |
            *GPU-размещение опубликовано в GHCR*
            Репозиторий: `${{ github.repository }}`
            Ветка: `${{ inputs.head_branch || github.ref_name }}`
            Теги: `:main-cuda` и `:${{ inputs.head_sha || github.sha }}-cuda`
            Образ: `${{ steps.image.outputs.name }}:main-cuda`
            [Открыть run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Dev cuda image published
        if: needs.publish-cuda-dev.result == 'success'
        uses: appleboy/telegram-action@v1.0.1
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          disable_notification: true
          message: |
            *GPU-размещение опубликовано в GHCR*
            Репозиторий: `${{ github.repository }}`
            Ветка: `${{ inputs.head_branch || github.ref_name }}`
            Теги: `:dev-cuda` и `:${{ inputs.head_sha || github.sha }}-cuda`
            Образ: `${{ steps.image.outputs.name }}:dev-cuda`
            [Открыть run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Prod cuda publish failed
        if: needs.publish-cuda-prod.result == 'failure'
        uses: appleboy/telegram-action@v1.0.1
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            *Публикация GPU-образа не удалась*
            Репозиторий: `${{ github.repository }}`
            Ветка: `${{ inputs.head_branch || github.ref_name }}`
            Теги: `:main-cuda` и `:${{ inputs.head_sha || github.sha }}-cuda`
            Образ: `${{ steps.image.outputs.name }}:main-cuda`
            [Открыть run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Dev cuda publish failed
        if: needs.publish-cuda-dev.result == 'failure'
        uses: appleboy/telegram-action@v1.0.1
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            *Публикация GPU-образа не удалась*
            Репозиторий: `${{ github.repository }}`
            Ветка: `${{ inputs.head_branch || github.ref_name }}`
            Теги: `:dev-cuda` и `:${{ inputs.head_sha || github.sha }}-cuda`
            Образ: `${{ steps.image.outputs.name }}:dev-cuda`
            [Открыть run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

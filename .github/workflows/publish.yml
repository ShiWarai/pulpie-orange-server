name: Publish Docker image

# workflow_run всегда исполняет файл с ветки по умолчанию (main),
# поэтому правки на dev никогда не попадали в ран. Этот workflow вызывается
# из Lint and test того же коммита, который только что прошёл проверки.
on:
  workflow_call:
    inputs:
      head_sha:
        description: SHA коммита, который прошёл Lint and test
        required: true
        type: string
      head_branch:
        description: Ветка этого коммита
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  publish-prod:
    if: (inputs.head_branch || github.ref_name) == 'main'
    name: Build and push prod to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pulpie-orange" >> $GITHUB_ENV

      - name: Build and push runtime (prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_BASE }}:main
            ${{ env.IMAGE_BASE }}:${{ inputs.head_sha || github.sha }}
          push: true
          provenance: false
          cache-from: type=gha,scope=pulpie-orange-main
          cache-to: type=gha,mode=max,scope=pulpie-orange-main

  publish-dev:
    if: (inputs.head_branch || github.ref_name) == 'dev'
    name: Build and push dev runtime to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pulpie-orange" >> $GITHUB_ENV

      - name: Build and push runtime (dev tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_BASE }}:dev
            ${{ env.IMAGE_BASE }}:${{ inputs.head_sha || github.sha }}
          push: true
          provenance: false
          cache-from: type=gha,scope=pulpie-orange-dev
          cache-to: type=gha,mode=max,scope=pulpie-orange-dev

  publish-cuda-prod:
    if: (inputs.head_branch || github.ref_name) == 'main'
    name: Build and push cuda (prod) to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pulpie-orange" >> $GITHUB_ENV

      - name: Build and push cuda (prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cuda
          # Официальный pytorch/*cuda* публикуется только под linux/amd64.
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_BASE }}:main-cuda
            ${{ env.IMAGE_BASE }}:${{ inputs.head_sha || github.sha }}-cuda
          push: true
          provenance: false
          cache-from: type=gha,scope=pulpie-orange-main-cuda
          cache-to: type=gha,mode=max,scope=pulpie-orange-main-cuda

  publish-cuda-dev:
    if: (inputs.head_branch || github.ref_name) == 'dev'
    name: Build and push cuda (dev) to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pulpie-orange" >> $GITHUB_ENV

      - name: Build and push cuda (dev)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cuda
          # Официальный pytorch/*cuda* публикуется только под linux/amd64.
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_BASE }}:dev-cuda
            ${{ env.IMAGE_BASE }}:${{ inputs.head_sha || github.sha }}-cuda
          push: true
          provenance: false
          cache-from: type=gha,scope=pulpie-orange-dev-cuda
          cache-to: type=gha,mode=max,scope=pulpie-orange-dev-cuda

  notify-telegram:
    name: Notify Telegram
    needs: [publish-prod, publish-dev, publish-cuda-prod, publish-cuda-dev]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Compose summary
        id: summary
        run: |
          base="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pulpie-orange"
          branch="${{ inputs.head_branch || github.ref_name }}"
          done=0
          failed=0
          lines=""
          check() {
            tag="$1"; result="$2"
            case "$result" in
              success) lines+="- \`${base}${tag}\` — OK\n"; done=$((done+1)) ;;
              failure|cancelled) lines+="- \`${base}${tag}\` — ошибка\n"; failed=$((failed+1)) ;;
            esac
          }
          check ":main" "${{ needs.publish-prod.result }}"
          check ":dev" "${{ needs.publish-dev.result }}"
          check ":main-cuda" "${{ needs.publish-cuda-prod.result }}"
          check ":dev-cuda" "${{ needs.publish-cuda-dev.result }}"
          if [ "$((done + failed))" -eq 0 ]; then
            echo "Нечего публиковать на этой ветке"
            exit 0
          fi
          if [ "$failed" -gt 0 ]; then
            title="*Публикация в GHCR не удалась*"
            silent="false"
          else
            title="*Образы опубликованы в GHCR*"
            silent="true"
          fi
          {
            echo "send=1"
            echo "silent=$silent"
            echo "msg<<EOF"
            echo "$title"
            echo "Репозиторий: \`${{ github.repository }}\`"
            echo "Ветка: \`${branch}\`"
            echo
            printf '%b' "$lines"
            echo "[Открыть run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send to Telegram
        if: steps.summary.outputs.send == '1'
        uses: appleboy/telegram-action@v1.0.1
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          disable_notification: ${{ steps.summary.outputs.silent }}
          message: ${{ steps.summary.outputs.msg }}

name: Publish Docker image

# Публикуется только по тегу. Тег режет release-please на мерже в main
# (см. release-please.yml): обычный тег v1.2.3 -> :main, prerelease-тег
# v1.2.3-pre.N -> :dev. Ветка уже не триггерит публикацию.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish-cpu:
    name: Build and push CPU image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          base="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pulpie-orange"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          {
            echo "cpu_tags<<EOF"
            echo "${base}:${version}"
            # prerelease-тег (есть "-" после версии) -> :dev; обычный -> :main + :latest
            if [[ "$version" == *-* ]]; then
              echo "${base}:dev"
            else
              echo "${base}:main"
              echo "${base}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push CPU
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.cpu_tags }}
          push: true
          provenance: false
          cache-from: type=gha,scope=pulpie-orange-cpu
          cache-to: type=gha,mode=max,scope=pulpie-orange-cpu

  publish-cuda:
    name: Build and push CUDA image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          base="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pulpie-orange"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          {
            echo "cuda_tags<<EOF"
            echo "${base}:${version}-cuda"
            if [[ "$version" == *-* ]]; then
              echo "${base}:dev-cuda"
            else
              echo "${base}:main-cuda"
              echo "${base}:latest-cuda"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push CUDA
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cuda
          # Официальный pytorch/*cuda* публикуется только под linux/amd64.
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.cuda_tags }}
          push: true
          provenance: false
          cache-from: type=gha,scope=pulpie-orange-cuda
          cache-to: type=gha,mode=max,scope=pulpie-orange-cuda

  notify-telegram:
    name: Notify Telegram
    needs: [publish-cpu, publish-cuda]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Compose summary
        id: summary
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          base="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pulpie-orange"
          if [[ "$version" == *-* ]]; then kind="prerelease"; else kind="release"; fi
          cpu="${{ needs.publish-cpu.result }}"
          cuda="${{ needs.publish-cuda.result }}"
          failed=0
          lines=""
          case "$cpu" in
            success) lines+="- \`${base}:${version}\` (CPU) — OK\n" ;;
            *) lines+="- CPU — ошибка\n"; failed=1 ;;
          esac
          case "$cuda" in
            success) lines+="- \`${base}:${version}-cuda\` (CUDA) — OK\n" ;;
            *) lines+="- CUDA — ошибка\n"; failed=1 ;;
          esac
          if [ "$failed" -gt 0 ]; then
            title="*Публикация в GHCR не удалась*"
            silent="false"
          else
            title="*Образы опубликованы в GHCR (${kind})*"
            silent="true"
          fi
          {
            echo "send=1"
            echo "silent=$silent"
            echo "msg<<EOF"
            echo "$title"
            echo "Репозиторий: \`${{ github.repository }}\`"
            echo "Тег: \`${tag}\`"
            echo
            printf '%b' "$lines"
            echo "[Открыть run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send to Telegram
        if: steps.summary.outputs.send == '1'
        uses: appleboy/telegram-action@v1.0.1
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          disable_notification: ${{ steps.summary.outputs.silent }}
          message: ${{ steps.summary.outputs.msg }}

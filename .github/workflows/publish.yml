name: Publish Docker image

# Публикация main-образов по схеме video-descriptor-rkllm: запуск после завершения
# гейта "Lint and test" на main, только если он зелёный. Без тегов и release-please.
# ВАЖНО: workflow_run всегда исполняет ЭТОТ файл в версии с ветки по умолчанию (main).
on:
  workflow_run:
    workflows: ["Lint and test"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish-cpu:
    name: Build and push CPU image
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pulpie-orange" >> $GITHUB_ENV

      - name: Build and push CPU
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha }}
          push: true
          provenance: false
          cache-from: type=gha,scope=pulpie-orange-cpu
          cache-to: type=gha,mode=max,scope=pulpie-orange-cpu

  publish-cuda:
    name: Build and push CUDA image
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pulpie-orange" >> $GITHUB_ENV

      - name: Build and push CUDA
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cuda
          # Официальный pytorch/*cuda* публикуется только под linux/amd64.
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:main-cuda
            ${{ env.IMAGE }}:latest-cuda
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha }}-cuda
          push: true
          provenance: false
          cache-from: type=gha,scope=pulpie-orange-cuda
          cache-to: type=gha,mode=max,scope=pulpie-orange-cuda

  notify-telegram:
    name: Notify Telegram
    needs: [publish-cpu, publish-cuda]
    if: always() && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Compose summary
        id: summary
        run: |
          sha="${{ github.event.workflow_run.head_sha }}"
          short="${sha:0:7}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          cpu="${{ needs.publish-cpu.result }}"
          cuda="${{ needs.publish-cuda.result }}"
          failed=0
          lines=""
          case "$cpu" in
            success) lines+="- \`ghcr.io/${owner}/pulpie-orange:main\` (CPU) — OK\n" ;;
            *) lines+="- CPU — ошибка\n"; failed=1 ;;
          esac
          case "$cuda" in
            success) lines+="- \`ghcr.io/${owner}/pulpie-orange:main-cuda\` (CUDA) — OK\n" ;;
            *) lines+="- CUDA — ошибка\n"; failed=1 ;;
          esac
          if [ "$failed" -gt 0 ]; then
            title="*Публикация в GHCR не удалась*"
            silent="false"
          else
            title="*Образы опубликованы в GHCR (main)*"
            silent="true"
          fi
          {
            echo "silent=$silent"
            echo "msg<<EOF"
            echo "$title"
            echo "Репозиторий: \`${{ github.repository }}\`"
            echo "Коммит: \`${short}\`"
            echo
            printf '%b' "$lines"
            echo "[Открыть run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send to Telegram
        uses: appleboy/telegram-action@v1.0.1
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          disable_notification: ${{ steps.summary.outputs.silent }}
          message: ${{ steps.summary.outputs.msg }}

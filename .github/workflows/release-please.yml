name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Cut release on merge to main
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # mode: push — сразу создаёт релизный коммит и тег на main (без PR).
          # Тег потом подхватывает workflow «Publish Docker image» (push: tags: v*).
          mode: push
          release-type: simple

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulpie Orange Small — HTML → Markdown</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
<h1><img class="logo" src="{{ url_for('static', filename='favicon.svg') }}" alt="🍊"> Pulpie Orange Small</h1>
<p class="subtitle">Извлечение основного контента из HTML в Markdown (210M, EuroBERT encoder)</p>
</header>

<main>
<div class="grid">
<div class="panel">
<label>Источник HTML</label>
<div class="tabs">
<button class="tab active" data-mode="paste">Вставить</button>
<button class="tab" data-mode="url">URL</button>
<button class="tab" data-mode="file">Файл</button>
</div>

<div class="tab-body active" id="body-paste">
<textarea id="html-input" autocomplete="off" placeholder="Вставьте HTML-код страницы..."></textarea>
</div>

<div class="tab-body" id="body-url">
<input id="url-input" type="text" autocomplete="url" placeholder="https://example.com" />
</div>

<div class="tab-body" id="body-file">
<input id="file-input" type="file" accept=".html,.htm,text/html" />
</div>

<div class="controls">
<label class="device">
Устройство:
<select id="device-select">
<option value="auto" selected>Auto</option>
<option value="cuda">GPU</option>
<option value="cpu">CPU</option>
</select>
</label>
<label class="opt">
<input type="checkbox" id="as-html"> Вывести HTML вместо MD
</label>
<label class="device">
API-ключ:
<input id="api-key" type="password" autocomplete="off" placeholder="если задан API_KEY" />
</label>
<label class="device">
Размер чанка (tok):
<select id="chunk-select">
<option value="512">512 (минимум)</option>
<option value="1024" selected>1K (быстро)</option>
<option value="2048">2K (баланс)</option>
<option value="4096">4K (максимум)</option>
</select>
</label>
<button id="process-btn" class="btn">▶ Обработать</button>
<button id="cancel-btn" class="btn cancel" style="display:none">■ Отменить</button>
</div>
<div class="progress-wrap" id="progress-wrap" style="display:none">
<div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
<div class="progress-text" id="progress-text"></div>
</div>
</div>

<div class="panel">
<div class="output-header">
<label id="result-label" data-md="Результат (Markdown)" data-html="Результат (HTML)">Результат (Markdown)</label>
<span id="stats" class="stats"></span>
</div>
<div class="view-toggle">
<button class="vtab active" data-view="preview">Предпросмотр</button>
<button class="vtab" data-view="source">Исходник</button>
</div>
<div id="output-wrap">
<pre id="output" class="preview"></pre>
</div>
<textarea id="output-source" class="source" autocomplete="off" style="display:none"></textarea>
</div>
</div>
</main>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
